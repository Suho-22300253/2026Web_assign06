<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-wrapper">

    <div class="container py-5">

        <!-- Header -->
        <div class="page-header d-flex flex-column flex-md-row
                    justify-content-between align-items-md-center gap-3 mb-4">

            <div>
                <p class="page-label mb-1">STUDENT MANAGEMENT</p>
                <h1 class="page-title mb-1">Student List</h1>
                <p class="page-description mb-0">
                    등록된 학생 정보를 확인할 수 있습니다.
                </p>
            </div>

            <!-- thymeleaf 문법으로 이를 통해 /students/new url을 실행 -->
            <a th:href="@{/students/new}"
               class="btn btn-dark btn-new-student">
                + Add Student
            </a>

        </div>


        <!-- Student Table -->
        <div class="card student-card border-0">

            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table student-table align-middle mb-0">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Semester</th>
                            <th>Major</th>
                            <th>RC</th>
                        </tr>
                        </thead>

                        <tbody>

                        <!--
                            model.addAttribute에서 students 라고 작성했기 때문에 students로 서버 데이터에 접근가능

                           써져있는 값들은 예시 값들
                        -->
                        <tr th:each="student : ${students}">

                            <!-- students list에 담긴 내용중 돌아가면 하나씩 내용 출력 -->
                            <td th:text="${student.id}">
                                1
                            </td>

                            <td th:text="${student.studentId}">
                                22300253
                            </td>

                            <td class="student-name"
                                th:text="${student.name}">
                                Hong Gil Dong
                            </td>

                            <td th:text="${student.semester}">
                                5
                            </td>

                            <td th:text="${student.major}">
                                AI Computer Science
                            </td>

                            <td>
                                <span class="rc-badge"
                                      th:text="${student.rc}">
                                    Kuyper
                                </span>
                            </td>

                        </tr>


                        <!-- 데이터가 없을 경우 -->
                        <tr th:if="${#lists.isEmpty(students)}">

                            <td colspan="6"
                                class="text-center empty-message">

                                등록된 학생이 없습니다.

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
