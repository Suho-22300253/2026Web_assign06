<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <!-- External CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-wrapper">

    <div class="container py-5">

        <div class="form-container">

            <!-- Header -->
            <div class="mb-4">

                <p class="page-label mb-1">
                    STUDENT MANAGEMENT
                </p>

                <h1 class="page-title mb-2">
                    Add Student
                </h1>

                <p class="page-description mb-0">
                    새로운 학생 정보를 입력해주세요.
                </p>

            </div>


            <!-- Form Card -->
            <div class="card student-card border-0">

                <div class="card-body form-card-body">

                    <!--
                    http://localhost:5050/students 에 post 요청 진행
                    -->
                    <form th:action="@{/students}"
                          method="post">


                        <!--name 과  request dto와 필드값 동일하게 진행-->
                        <!-- Student ID -->
                        <div class="mb-4">

                            <label for="studentId"
                                   class="form-label">
                                Student ID
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="studentId"
                                    name="studentId"
                                    placeholder="예: 22300253"
                                    pattern="[0-9]{8}"
                                    maxlength="8"
                                    required
                            >

                            <div class="form-text">
                                8자리 학번을 입력해주세요.
                            </div>

                        </div>


                        <!-- Name -->
                        <div class="mb-4">

                            <label for="name"
                                   class="form-label">
                                Name
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    placeholder="학생 이름"
                                    required
                            >

                        </div>


                        <!-- Semester -->
                        <div class="mb-4">

                            <label for="semester"
                                   class="form-label">
                                Semester
                            </label>

                            <input
                                    type="number"
                                    class="form-control"
                                    id="semester"
                                    name="semester"
                                    placeholder="현재 학기"
                                    min="1"
                                    required
                            >

                        </div>


                        <!-- Major -->
                        <div class="mb-4">

                            <label for="major"
                                   class="form-label">
                                Major
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="major"
                                    name="major"
                                    placeholder="전공"
                                    required
                            >

                        </div>


                        <!-- RC -->
                        <div class="mb-4">

                            <label for="rc"
                                   class="form-label">
                                RC
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    id="rc"
                                    name="rc"
                                    placeholder="RC"
                                    required
                            >

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex flex-column flex-sm-row gap-2 mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-dark flex-grow-1">
                                Register Student
                            </button>

                            <a th:href="@{/students}"
                               class="btn btn-outline-secondary">
                                Back to List
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
